# Ask Roshni Worker (docs/ask-roshni.md, "On the website"). Deployed by
# .github/workflows/worker-deploy.yml on every change to worker/. Free plan: Workers + one
# SQLite-backed Durable Object. Secrets (never in this file): GROQ_API_KEY (copied from the repo
# secret on every deploy) and VISITOR_SALT (set once in Cloudflare, kept across deploys).
name = "roshni-ask"
main = "src/index.ts"
account_id = "ab63e70bd4be38c7b7e22b3e24a244c8"  # not a secret; lets CI deploy with an API token
compatibility_date = "2026-11-01"

[vars]
CONTEXT_URL = "https://azzammasood.github.io/roshni-site/data/v1/ask/context.json"
ALLOWED_ORIGINS = "https://azzammasood.github.io"
# Caps. One question costs about 3,300 tokens (ask-eval: 81,248 tokens for 25 items). Groq's
# free plan allows 200K tokens/day and 8K tokens/min per model, three models in the chain.
VISITOR_PER_MINUTE = "3"
VISITOR_PER_DAY = "10"
SITE_PER_MINUTE = "6"
SITE_PER_DAY = "150"
SITE_TOKENS_PER_DAY = "450000"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

[observability]
enabled = true
