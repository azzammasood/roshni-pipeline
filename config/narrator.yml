# OpenRouter narrator (OpenAI-compatible). The LLM writes prose only; numbers come from SQL.
# Fallback chain: the first model that exists in the live /models list, fits the spend cap and
# passes validation is used. Unknown ids are skipped (ids change; edit freely).
# ROSHNI_NARRATOR_MODEL (env) is tried first; ROSHNI_NARRATOR_SPEND_CAP_USD overrides the cap.
# Owner (2026-10-13): use prepaid credits on a cheap model first; when they run out, OpenRouter
# answers HTTP 402 and the chain falls through to the free (":free") models (50 requests/day).
# Claude Haiku 5.5: $0.10 / $0.50 per M tokens, about $0.0006 per report.
models:
  - anthropic/claude-haiku-5.5
  - nvidia/nemotron-3-ultra-550b-a55b:free
  - google/gemma-4-31b-it:free
  - google/gemma-4-26b-a4b-it:free
max_tokens: 2000   # room for reasoning models; billed on actual use
temperature: 0.2
spend_cap_usd: 0.01   # hard cap per run (Haiku 5.5 worst case ~$0.0012), priced from live /models
