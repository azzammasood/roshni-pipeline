repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Committed census tables (DECISIONS 2026-10-12): static, 2.6 MB in total.
        exclude: ^census/pbs_[a-z_]+\.parquet$
      - id: detect-private-key

  - repo: local
    hooks:
      - id: block-data-sources
        name: block anything under data-sources/
        entry: "data-sources/ must never be committed"
        language: fail
        files: ^data-sources/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
