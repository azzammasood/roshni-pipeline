version: 2
models:
- name: dim_feeder
  description: 'One row per feeder for IESCO (key: circle + 6-digit code) and K-Electric (key: normalised
    name). K-Electric keeps both taxonomies: IBC area (from the list) and grid (from the schedule). Quarantined
    IESCO rows are in quarantine_feeder. No coordinates exist in any source; geography is area-level.

    '
  columns:
  - name: feeder_id
    data_tests:
    - unique
    - not_null
  - name: source
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - iesco
          - kelectric
  - name: feeder_name
    data_tests:
    - not_null
  - name: category
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Medium
          - High
          - Very High
  - name: schedule_match_confidence
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 1
- name: fct_schedule_window
  description: 'Recurring daily windows from published schedules, never measured outages. Times are local
    Asia/Karachi minutes of day; K-Electric cycles may wrap midnight. IESCO rows are a scenario playbook
    (one set per interruption level). Every row carries effective_from from source_documents.

    '
  columns:
  - name: window_id
    data_tests:
    - unique
    - not_null
  - name: feeder_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_feeder')
          field: feeder_id
  - name: schedule_kind
    data_tests:
    - accepted_values:
        arguments:
          values:
          - daily_cycle
          - scenario_level
  - name: start_minute_local
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 1439
  - name: end_minute_local
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 1440
  - name: duration_minutes
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1
          max_value: 720
  - name: effective_from
    description: Effective date of the source document; null means an unreviewed new file.
    data_tests:
    - not_null
- name: fct_planned_shutdown
  description: 'Dated planned-shutdown windows from IESCO English press releases (announcements, not measurements).
    Start and end stored in UTC and as printed local time.

    '
  columns:
  - name: shutdown_id
    data_tests:
    - unique
    - not_null
  - name: outage_date
    data_tests:
    - not_null
  - name: start_utc
    data_tests:
    - not_null
  - name: end_utc
    data_tests:
    - not_null
- name: dim_area_indicators
  description: 'PBS Census 2023 indicators per urban or rural area: literacy, degree-and-above share,
    pacca housing share, electricity access share, household size. Shares are descriptive; gas is excluded
    as a wealth proxy. Rows with ambiguous keys are in quarantine_area.

    '
  columns:
  - name: area_id
    data_tests:
    - unique
    - not_null
  - name: area_type
    data_tests:
    - accepted_values:
        arguments:
          values:
          - urban
          - rural
  - name: literacy_pct
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: pacca_share_pct
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: electricity_share_pct
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 100
- name: mart_ke_feeder_hours
  description: 'K-Electric listed feeders with scheduled hours per day (6 or 12) next to category, ATC
    loss, IBC and grid. Basis for the descriptive fairness analysis; shares are among listed feeders.

    '
  columns:
  - name: feeder_id
    data_tests:
    - unique
    - not_null
  - name: scheduled_hours_per_day
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 6
          - 12
          quote: false
  - name: cycles
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 4
          quote: false
- name: quarantine_feeder
  description: IESCO feeder rows held out of dim_feeder, each with a reason (anomalies flagged, not fixed).
  columns:
  - name: reason
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - non_numeric_code
          - other_disco_feeder_sharing_code
          - duplicate_code_in_circle
- name: quarantine_schedule_window
  description: IESCO scenario slots held out of fct_schedule_window, each with a reason.
  columns:
  - name: reason
    data_tests:
    - not_null
- name: quarantine_area
  description: Census area rows held out of dim_area_indicators because their key is ambiguous.
  columns:
  - name: reason
    data_tests:
    - not_null
- name: feeder_locality_match
  description: IESCO feeder to census locality matches that count (auto_exact or owner-accepted), with
    method and confidence. Name-based only; no coordinates exist.
  columns:
  - name: feeder_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_feeder')
          field: feeder_id
  - name: area_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_area_indicators')
          field: area_id
  - name: match_confidence
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 1
- name: fct_planned_shutdown_feeder
  description: fct_planned_shutdown plus the matched IESCO feeder (if any), match status and confidence,
    and why unmatched rows are unmatched.
  columns:
  - name: shutdown_id
    data_tests:
    - unique
    - not_null
  - name: feeder_id
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_feeder')
          field: feeder_id
  - name: feeder_match_state
    data_tests:
    - accepted_values:
        arguments:
          values:
          - matched
          - pending_review
          - unmatched
          - out_of_scope
- name: ke_ibc_subdivision
  description: Owner-accepted K-Electric IBC to Karachi sub-division crosswalk; IBCs outside Sindh census
    coverage are listed as out_of_scope.
  columns:
  - name: ibc
    data_tests:
    - not_null
  - name: subdivision_area_id
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_area_indicators')
          field: area_id
- name: dim_area
  description: 'All areas: census areas, K-Electric IBC areas and IESCO circles. geometry_wkt stays null
    until an approved boundary source exists.'
  columns:
  - name: area_id
    data_tests:
    - unique
    - not_null
  - name: source
    data_tests:
    - not_null
- name: rpt_match_rates
  description: 'Match rates per resolution task and group: matched, pending review, unmatched, out of
    scope, and matched share in scope.'
  columns:
  - name: task
    data_tests:
    - not_null
- name: mart_build_info
  description: Timestamp (UTC) of the warehouse build; fallback last_updated for live outputs.
- name: mart_feeder_dark_hours
  description: Scheduled dark minutes per feeder per local hour of day (Asia/Karachi) for K-Electric daily
    cycles and each IESCO scenario level. Schedule data, not measured outages; basis for the static 'dark
    now' export.
  columns:
  - name: feeder_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_feeder')
          field: feeder_id
  - name: hour_of_day
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 23
  - name: dark_minutes
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1
          max_value: 60
- name: mart_ke_ibc_equity
  description: 'Per K-Electric IBC: listed and scheduled feeders, feeders at 6 h and 12 h, share at 12
    h, mean scheduled hours, mean ATC loss (n with loss), category counts, census sub-division if crosswalked.
    Among listed feeders only; schedule data; descriptive.'
  columns:
  - name: ibc
    data_tests:
    - unique
    - not_null
  - name: share_12h_pct
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
          max_value: 100
- name: mart_ke_subdivision_equity
  description: Scheduled hours of listed K-Electric feeders aggregated to census sub-divisions via the
    accepted IBC crosswalk, with census indicators. Exploratory; extents of IBCs and sub-divisions are
    not verified.
  columns:
  - name: subdivision_area_id
    data_tests:
    - unique
    - not_null
- name: rpt_spearman
  description: 'Exploratory Spearman rank correlations with n: sub-division share at 12 h vs census indicators
    and mean loss; feeder-level ATC loss vs scheduled hours. No significance or causal claims.'
  columns:
  - name: n
    data_tests:
    - not_null
  - name: spearman_rho
    data_tests:
    - accepted_range:
        arguments:
          min_value: -1
          max_value: 1
- name: rpt_ke_anomalies
  description: Rule-based observations on the K-Electric list and schedule (counts per rule). Observations,
    not findings of unfairness.
  columns:
  - name: rule
    data_tests:
    - unique
    - not_null
- name: mart_nepra_load_shedding
  description: 'Average daily load-shedding hours as reported to NEPRA, one value per company and
    fiscal year (earliest report listing the year), with the spread across reports that restate it.

    '
  columns:
  - name: company_year_id
    data_tests:
    - unique
    - not_null
  - name: reported_hours_per_day
    data_tests:
    - not_null
  - name: values_disagree
    data_tests:
    - not_null
- name: mart_news_headline
  description: 'The 12 most recent load-shedding headlines, however old, shown with outlet, date and
    link only.

    '
  columns:
  - name: link
    data_tests:
    - unique
    - not_null
- name: mart_nepra_ke_order
  description: 'NEPRA order on K-Electric (2026-08-31): feeders by average daily outage band and loss
    category, with the category schedule; NEPRA''s figures from K-Electric data.

    '
  columns:
  - name: band_id
    data_tests:
    - unique
    - not_null
  - name: above_schedule
    data_tests:
    - not_null
