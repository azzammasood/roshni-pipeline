version: 2

sources:
  - name: parsed
    description: >
      Typed Parquet tables written by `roshni parse` (validated by Great Expectations). On DuckDB
      each table is read from its file via external_location; on Databricks they are uploaded
      tables with the same names, so model SQL never references files.
    # Databricks: tables uploaded by scripts/databricks_load.py into <catalog>.roshni_raw.
    schema: "{{ 'roshni_raw' if target.type == 'databricks' else 'main' }}"
    config:
      external_location: "{{ env_var('ROSHNI_PARSED_DIR', '../data/parsed') ~ '/{name}.parquet' if target.type == 'duckdb' else none }}"
    tables:
      - name: iesco_feeder
        description: One row per feeder row in the six IESCO circle workbooks.
      - name: iesco_schedule_slot
        description: One row per IESCO feeder x scenario level x one-hour slot.
      - name: iesco_press_release_window
        description: One row per feeder named in an IESCO planned-shutdown press release.
      - name: iesco_maintenance_window
        description: >
          IESCO monthly maintenance schedules (owner approval 2026-10-18): one row per printed
          window per stored workbook version. Announced maintenance, not load shedding.
      - name: kelectric_feeder_list
        description: K-Electric list of feeders under load shed (category, loss, IBC).
      - name: kelectric_schedule
        description: K-Electric schedule, one row per feeder (grid, total daily minutes).
      - name: kelectric_schedule_cycle
        description: K-Electric schedule, one row per feeder x cycle (four per feeder).
      - name: nepra_load_shedding
        description: >
          NEPRA Performance Evaluation Reports, section 3.6: average daily load-shedding hours each
          distribution company reported to NEPRA, one row per report x fiscal year x company
          (reports restate the previous four years).
      - name: kelectric_schedule_version
        description: >
          Every stored version of K-Electric's schedule PDF: feeders and mean daily scheduled
          minutes (schedule, not measured); effective date from the source_documents seed.
      - name: nepra_ke_order_category
        description: >
          NEPRA's order on K-Electric (2026-08-31): feeders, consumers, average AT&C % and
          K-Electric's scheduled hours per loss category, as printed (NEPRA's analysis of
          K-Electric data, not measured by Roshni).
      - name: nepra_ke_order_band
        description: >
          Same order: feeders and consumers per average daily outage band and loss category.
      - name: news_headline
        description: >
          Load-shedding headlines from the approved outlets' RSS feeds (trimmed before storage):
          headline, outlet, link, publication time; one row per story link.
      - name: pbs_urban_population
        description: PBS Census 2023 table 33, urban localities, population.
      - name: pbs_urban_housing
        description: PBS Census 2023 table 34, urban localities, housing.
      - name: pbs_rural_population
        description: PBS Census 2023 table 31, rural localities, population.
      - name: pbs_rural_housing
        description: PBS Census 2023 table 32, rural localities, housing.
