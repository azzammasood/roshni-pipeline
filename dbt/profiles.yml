# `roshni build` sets the DuckDB paths. The databricks target reads credentials from environment
# variables only (never commit them): DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DATABRICKS_TOKEN.
roshni:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('ROSHNI_DUCKDB_PATH', '../data/roshni.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') | replace('https://', '') | trim('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('ROSHNI_DATABRICKS_CATALOG', 'workspace') }}"
      schema: roshni
      threads: 4
