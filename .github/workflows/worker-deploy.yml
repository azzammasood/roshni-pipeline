# Deploy the Ask Roshni Worker (worker/) to Cloudflare. Owner, 2026-11-26: deploys run here, not
# from a laptop. Secrets: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers") and
# GROQ_API_KEY (the same repo secret publish uses; copied into the Worker on every deploy, so a
# rotated key needs only `gh secret set GROQ_API_KEY` and a re-run). VISITOR_SALT lives only in
# Cloudflare and is kept across deploys.
name: worker-deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

env:
  WORKER_URL: https://roshni-ask.ahmaduzzammasood.workers.dev
  SITE_ORIGIN: https://azzammasood.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy
        run: npx wrangler deploy
      - name: Copy the Groq key into the Worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
      # The chain's last fallback (OpenRouter's free models) needs its key in the Worker too;
      # without it the Worker skipped OpenRouter (found by the model probe, 2026-11-28).
      - name: Copy the OpenRouter key into the Worker
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "no OPENROUTER_API_KEY secret"; exit 0; fi
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
      # Optional: Cloudflare Turnstile's secret key (repo secret TURNSTILE_SECRET). With it the
      # Worker needs a valid widget token before it spends a question; the site key is the repo
      # variable TURNSTILE_SITE_KEY, read by publish.yml at build time.
      - name: Copy the Turnstile secret into the Worker
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$TURNSTILE_SECRET" ]; then echo "no TURNSTILE_SECRET secret: Turnstile stays off"; exit 0; fi
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET
      # Optional: the token the publish job uses to read visitors' shared questions (opt-in,
      # GET /v1/shared). Without the repo secret the endpoint stays off.
      - name: Copy the admin token into the Worker
        env:
          ASK_ADMIN_TOKEN: ${{ secrets.ASK_ADMIN_TOKEN }}
        run: |
          if [ -z "$ASK_ADMIN_TOKEN" ]; then echo "no ASK_ADMIN_TOKEN secret: sharing stays off"; exit 0; fi
          printf '%s' "$ASK_ADMIN_TOKEN" | npx wrangler secret put ASK_ADMIN_TOKEN
      - name: Smoke test the live Worker (no question is asked, so no quota is spent)
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/v1/quota")
          test "$code" = 403 || { echo "no-origin request returned $code, expected 403"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: https://example.com" "$WORKER_URL/v1/quota")
          test "$code" = 403 || { echo "foreign origin returned $code, expected 403"; exit 1; }
          body=$(curl -sf -H "Origin: $SITE_ORIGIN" "$WORKER_URL/v1/quota")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # A new route can take a few seconds to reach every edge after a deploy: retry it.
          for attempt in $(seq 1 12); do
            stats=$(curl -sf -H "Origin: $SITE_ORIGIN" "$WORKER_URL/v1/stats" || true)
            if echo "$stats" | grep -q '"window_days":30'; then echo "$stats" | head -c 300; echo; exit 0; fi
            sleep 5
          done
          echo "/v1/stats did not answer after a minute: $stats"; exit 1
