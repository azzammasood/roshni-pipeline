name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # data-sources/ is not in git: tests marked needs_data_sources skip here.
      - run: uv run pytest
      # No parsed data in CI: parse the dbt project to catch SQL/YAML errors without building.
      - run: uv run roshni build --command parse

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Types in src/types/v1 must match schemas/v1 (generated by the Python export models).
      - run: npm run check:types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No export in CI: build the static site from trimmed fixtures, with the Pages base path.
      - run: npm run sync-data:fixtures
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /roshni-pipeline
