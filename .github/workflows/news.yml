# News feeds only, every 3 hours (owner, 2026-10-14): feeds list just their latest items, so a
# daily fetch missed stories. Same store and trimming as `snapshot` (load-shedding headlines only,
# never article text). Shares the `snapshot` concurrency group so the two never push to
# data-snapshots at once. Not named `snapshot`, so it does not trigger `publish`: the site still
# publishes once a day, from every headline caught since.
name: news

on:
  schedule:
    - cron: "15 */3 * * *" # every 3 hours at :15 UTC (00:15, 03:15, ...)
  workflow_dispatch:

permissions:
  contents: write
  issues: write # failure-issue.sh

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --no-dev

      - name: Check out data-snapshots into ./store
        run: |
          git fetch --depth=1 origin data-snapshots:data-snapshots
          git worktree add store data-snapshots

      - name: Snapshot news feeds
        id: snap
        run: |
          set +e
          uv run roshni snapshot --store store --only 'news_*'
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push snapshots
        if: always()
        working-directory: store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "news: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data-snapshots

      - name: Fail if the snapshot reported errors
        if: steps.snap.outputs.status != '0'
        run: exit 1

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/failure-issue.sh fail "news"
      - name: Close the failure issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/failure-issue.sh ok "news"
